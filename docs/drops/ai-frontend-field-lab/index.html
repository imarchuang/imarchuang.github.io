<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A deterministic, interactive lab for four AI-native frontend patterns.">
  <title>AI Frontend Field Lab</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #F1F4F0;
      --ink: #17212B;
      --blue: #315CFF;
      --coral: #FF6846;
      --mint: #2FBF8F;
      --violet: #7357FF;
      --rule: #CCD4D1;
      --white: #FBFCFA;
      --muted: #5A666E;
      --display: Rockwell, "Roboto Slab", "Iowan Old Style", serif;
      --body: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --mono: SFMono-Regular, Consolas, "Liberation Mono", monospace;
      --shadow: 0 8px 24px rgba(23, 33, 43, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 var(--body);
    }
    button, select, input { font: inherit; }
    button, select {
      border: 1px solid var(--ink);
      border-radius: 0;
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
    }
    button { padding: .65rem .85rem; font-weight: 650; }
    button:hover { box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px, -1px); }
    button:disabled { cursor: not-allowed; opacity: .5; box-shadow: none; transform: none; }
    :focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
    a { color: var(--blue); text-underline-offset: .18em; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--display); line-height: 1.08; }
    h1 { max-width: 17ch; margin-bottom: .65rem; font-size: clamp(2.35rem, 7vw, 5.6rem); letter-spacing: -.04em; }
    h2 { font-size: clamp(1.75rem, 3vw, 2.75rem); }
    h3 { font-size: 1.15rem; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .lab-header {
      padding: 1.2rem max(1.1rem, calc((100vw - 1500px) / 2));
      border-bottom: 1px solid var(--ink);
    }
    .lab-header > a { display: inline-block; margin-bottom: 3rem; font-family: var(--mono); font-size: .78rem; text-transform: uppercase; }
    .kicker, .eyebrow, .label, .event-type, .risk, .protocol-line, .data-table th {
      font-family: var(--mono);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .kicker { margin-bottom: .65rem; color: var(--blue); }
    .header-copy { max-width: 58ch; font-size: 1.12rem; }
    .simulation-note {
      display: inline-flex;
      gap: .45rem;
      align-items: center;
      padding: .35rem .55rem;
      border: 1px solid var(--rule);
      font-family: var(--mono);
      font-size: .75rem;
    }
    .simulation-note::before { width: .5rem; height: .5rem; border-radius: 50%; background: var(--mint); content: ""; }
    .lab {
      display: grid;
      grid-template-columns: minmax(150px, .7fr) minmax(480px, 3fr) minmax(220px, 1fr);
      min-height: 650px;
      border-bottom: 1px solid var(--ink);
    }
    .case-rail, .instrument, .case-file { min-width: 0; padding: 1rem; }
    .case-rail { border-right: 1px solid var(--ink); }
    .case-file { border-left: 1px solid var(--ink); background: rgba(255, 255, 255, .34); }
    .rail-list { display: grid; gap: .65rem; margin: 0; padding: 0; list-style: none; }
    .station-tab { width: 100%; min-height: 4.5rem; padding: .65rem; text-align: left; }
    .station-tab[aria-current="step"] { background: var(--blue); color: white; box-shadow: 4px 4px 0 var(--ink); }
    .station-number { display: block; font-family: var(--mono); font-size: .7rem; }
    .progress-track { height: 4px; margin: 1.25rem 0; background: var(--rule); }
    .progress-fill { height: 100%; background: var(--blue); transition: width .2s ease; }
    .instrument { overflow: hidden; background-color: var(--white); }
    .instrument-head { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; margin-bottom: 1.2rem; }
    .instrument-head p { max-width: 58ch; color: var(--muted); }
    .controls, .query-chips, .filter-list, .intent-picker, .decision-row {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
      margin-bottom: 1rem;
    }
    .primary { background: var(--blue); color: white; }
    .danger { border-color: var(--coral); color: #9F2E16; }
    .selected { background: var(--ink); color: white; }
    .panel {
      border: 1px solid var(--ink);
      padding: 1rem;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .canvas {
      position: relative;
      min-height: 470px;
      overflow: hidden;
      border: 1px solid var(--ink);
      background-image:
        linear-gradient(var(--rule) 1px, transparent 1px),
        linear-gradient(90deg, var(--rule) 1px, transparent 1px);
      background-size: 24px 24px;
      touch-action: none;
    }
    .evidence-card {
      position: absolute;
      width: clamp(130px, 24%, 190px);
      min-height: 92px;
      padding: .65rem;
      border: 1px solid var(--ink);
      background: var(--white);
      box-shadow: 3px 3px 0 rgba(23, 33, 43, .25);
      cursor: grab;
      user-select: none;
      transform: translate(-50%, -50%);
      transition: left .28s ease, top .28s ease;
    }
    .evidence-card.dragging { transition: none; }
    .evidence-card:active { cursor: grabbing; }
    .evidence-card[data-group="checkout"] { border-top: 5px solid var(--blue); }
    .evidence-card[data-group="latency"] { border-top: 5px solid var(--coral); }
    .evidence-card[data-group="unrelated"] { border-top: 5px dashed var(--rule); }
    .card-kind { display: block; margin-bottom: .35rem; color: var(--muted); font: 700 .65rem var(--mono); text-transform: uppercase; }
    .card-copy { margin: 0; font-size: .82rem; line-height: 1.28; }
    .card-menu { position: absolute; right: .25rem; bottom: .25rem; }
    .card-menu summary { padding: .1rem .3rem; border: 1px solid var(--rule); background: var(--paper); cursor: pointer; font: .68rem var(--mono); }
    .move-grid {
      position: absolute;
      z-index: 4;
      right: 0;
      display: grid;
      grid-template-columns: repeat(3, 1.75rem);
      padding: .3rem;
      border: 1px solid var(--ink);
      background: var(--white);
    }
    .move-grid button { padding: .15rem; font-size: .7rem; }
    .move-grid button:nth-child(1) { grid-column: 2; }
    .move-grid button:nth-child(2) { grid-column: 1; grid-row: 2; }
    .move-grid button:nth-child(3) { grid-column: 3; grid-row: 2; }
    .move-grid button:nth-child(4) { grid-column: 2; grid-row: 3; }
    .cue-note { margin-top: .8rem; border-left: 5px solid var(--mint); }
    .ask-layout, .compose-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(220px, .75fr); gap: 1rem; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--ink); }
    .data-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .data-table th, .data-table td { padding: .55rem; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
    .data-table tr.relevant { background: #DDE4FF; }
    .dictionary { display: grid; gap: .5rem; margin: 0; }
    .dictionary div { padding-bottom: .5rem; border-bottom: 1px solid var(--rule); }
    .dictionary dt { font: 700 .72rem var(--mono); }
    .dictionary dd { margin: .15rem 0 0; color: var(--muted); font-size: .82rem; }
    .analysis-result { margin-top: 1rem; border-top: 5px solid var(--violet); }
    .formula { padding: .6rem; overflow-wrap: anywhere; background: var(--ink); color: white; font: .76rem var(--mono); }
    .bars { display: grid; gap: .65rem; margin: 1rem 0; }
    .bar-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) 3.2rem; gap: .5rem; align-items: center; font-size: .78rem; }
    .bar-track { height: 1.2rem; background: var(--rule); }
    .bar-fill { height: 100%; min-width: 2px; background: var(--violet); }
    .confidence { font-family: var(--mono); color: #147758; }
    .stream-log { max-height: 360px; overflow: auto; padding: .7rem; background: var(--ink); color: #D7E0DD; }
    .protocol-line { margin: 0 0 .55rem; text-transform: none; letter-spacing: 0; }
    .surface { display: grid; gap: .7rem; min-height: 320px; }
    .surface-node { border: 1px solid var(--ink); padding: .75rem; background: var(--white); }
    .surface-metric strong { display: block; font: 2rem var(--display); }
    .blocked { border: 2px dashed var(--coral); color: #842A16; }
    .timeline-list, .evidence-list { margin: 0; padding-left: 1.2rem; }
    .action-plan { display: grid; gap: .8rem; }
    .action-step { border: 1px solid var(--ink); padding: 1rem; background: var(--white); }
    .action-step h3 { margin-bottom: .35rem; }
    .risk { display: inline-block; margin-bottom: .45rem; padding: .18rem .4rem; border: 1px solid currentColor; }
    .risk-read-only { color: var(--blue); }
    .risk-reversible { color: #147758; }
    .risk-consequential { color: #9F2E16; }
    .diff { display: grid; gap: .3rem; margin: .8rem 0; padding: .75rem; background: var(--ink); color: white; font: .78rem/1.45 var(--mono); }
    .edit-rollout { display: flex; gap: .5rem; align-items: center; margin: .7rem 0; }
    .edit-rollout input { width: 5rem; padding: .5rem; border: 1px solid var(--ink); }
    .execution { margin-top: .7rem; padding: .7rem; border-left: 5px solid var(--mint); background: #E2F5ED; }
    .action-notice { margin-bottom: .8rem; border-left: 5px solid var(--violet); }
    .case-file dl { margin: 0; }
    .case-file div { padding: .65rem 0; border-bottom: 1px solid var(--rule); }
    .case-file dt { color: var(--muted); font: .68rem var(--mono); text-transform: uppercase; }
    .case-file dd { margin: .2rem 0 0; font-weight: 700; overflow-wrap: anywhere; }
    .event-tape { position: relative; padding: 1rem max(1.1rem, calc((100vw - 1500px) / 2)) 2rem; background: var(--ink); color: white; }
    .tape-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .8rem; }
    .event-tape h2 { margin-bottom: .35rem; font-size: 1.8rem; }
    .event-tape button { border-color: #AAB4B1; background: transparent; color: white; }
    .event-tape button.selected { background: white; color: var(--ink); }
    .scope { display: block; width: 100%; height: 35px; margin: .65rem 0 1rem; overflow: visible; }
    .scope polyline { fill: none; stroke: var(--mint); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .scope.pulse polyline { animation: scope-pulse .5s ease-out; }
    @keyframes scope-pulse { 50% { stroke: var(--coral); stroke-width: 5; } }
    .events { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .55rem; }
    .event-row { border-top: 1px solid #657078; padding-top: .55rem; }
    .event-row button { width: 100%; padding: .35rem 0; border: 0; text-align: left; box-shadow: none; transform: none; }
    .event-meta { display: flex; gap: .55rem; color: #B9C3C0; font: .66rem var(--mono); }
    .event-summary { display: block; margin-top: .25rem; font-size: .85rem; }
    .event-payload { max-height: 180px; margin: .4rem 0 0; padding: .55rem; overflow: auto; background: #091016; color: #D7E0DD; font: .68rem/1.4 var(--mono); white-space: pre-wrap; }
    .reversible::after { content: " · reversible"; color: var(--mint); }
    @media (max-width: 980px) {
      .lab { grid-template-columns: 135px minmax(0, 1fr); }
      .case-file { grid-column: 1 / -1; border-top: 1px solid var(--ink); border-left: 0; }
      .case-file dl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    }
    @media (max-width: 680px) {
      html { scroll-behavior: auto; }
      .lab-header > a { margin-bottom: 2rem; }
      .lab { display: block; }
      .case-rail { overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--ink); }
      .rail-list { grid-template-columns: repeat(4, minmax(118px, 1fr)); }
      .progress-track { margin-bottom: 0; }
      .instrument, .case-file { padding: 1rem; }
      .instrument-head, .ask-layout, .compose-layout { display: block; }
      .instrument-head .simulation-note { margin-bottom: 1rem; }
      .canvas { min-height: 520px; }
      .evidence-card { width: 40%; min-width: 125px; }
      .ask-layout > *, .compose-layout > * { margin-bottom: 1rem; }
      .case-file dl { grid-template-columns: 1fr 1fr; }
      .event-tape { position: static; }
      .bar-row { grid-template-columns: 5.5rem minmax(0, 1fr) 2.8rem; }
    }
    @media (max-width: 390px) {
      h1 { font-size: 2.55rem; }
      .lab-header, .instrument, .case-file, .case-rail, .event-tape { padding-left: .75rem; padding-right: .75rem; }
      .controls button, .decision-row button { flex: 1 1 9rem; }
      .canvas { min-height: 560px; }
      .evidence-card { min-width: 115px; font-size: .75rem; }
      .case-file dl { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="lab-header">
    <a href="/drops/">Marc's drops</a>
    <p class="kicker">AI Frontend Field Lab · deterministic simulation</p>
    <h1>What happens when AI leaves the chat box?</h1>
    <p class="header-copy">Work one checkout incident through four frontend instruments: spatial evidence, governed analysis, declarative surfaces, and reversible action.</p>
    <span class="simulation-note">No model or backend calls</span>
  </header>
  <main class="lab">
    <nav class="case-rail" aria-label="Lab instruments"></nav>
    <section class="instrument" aria-live="off"></section>
    <aside class="case-file" aria-label="Shared case state"></aside>
  </main>
  <section class="event-tape" aria-labelledby="event-title"></section>
  <p class="sr-only" aria-live="polite" id="announcer"></p>
  <script>
    "use strict";

    const EVIDENCE = Object.freeze([
      { id: "quote-1", kind: "Customer quote", text: "Checkout freezes after I tap Pay on my phone.", x: 18, y: 23 },
      { id: "metric-1", kind: "Telemetry", text: "Mobile-web checkout failure rose from 4% to 18%.", x: 72, y: 18 },
      { id: "release-1", kind: "Release", text: "2026.08.25 changed mobile payment retries.", x: 45, y: 42 },
      { id: "trace-1", kind: "Trace", text: "Payment authorization p95 increased to 4.8 seconds.", x: 78, y: 68 },
      { id: "quote-2", kind: "Customer quote", text: "The spinner runs, then my card is declined.", x: 24, y: 73 },
      { id: "distractor", kind: "Release note", text: "Desktop search filters received new icons.", x: 52, y: 85 }
    ]);
    const ROWS = Object.freeze([
      { release: "2026.08.18", platform: "mobile-web", sessions: 18400, failures: 736, rate: 4, latency: 1.5 },
      { release: "2026.08.18", platform: "desktop", sessions: 12100, failures: 363, rate: 3, latency: 1.3 },
      { release: "2026.08.25", platform: "mobile-web", sessions: 18900, failures: 3402, rate: 18, latency: 4.8 },
      { release: "2026.08.25", platform: "desktop", sessions: 11900, failures: 357, rate: 3, latency: 1.4 }
    ]);
    const QUERIES = Object.freeze({
      release: {
        label: "Which release changed failure rate?",
        formula: "checkout_failures / checkout_sessions GROUP BY release",
        plan: { metric: "checkout_failure_rate", dimensions: ["release"], compare: "previous release" },
        result: "Release 2026.08.25 raised mobile-web failure rate by 14 percentage points.",
        bars: [["2026.08.18", 4], ["2026.08.25", 18]],
        relevant: [0, 2],
        citations: ["Support warehouse · checkout_daily", "Release registry · mobile-web"]
      },
      platform: {
        label: "Segment by platform",
        formula: "checkout_failures / checkout_sessions GROUP BY platform",
        plan: { metric: "checkout_failure_rate", dimensions: ["platform"], release: "2026.08.25" },
        result: "The regression is isolated to mobile-web; desktop remains at 3%.",
        bars: [["mobile-web", 18], ["desktop", 3]],
        relevant: [2, 3],
        citations: ["Support warehouse · checkout_daily"]
      },
      latency: {
        label: "Does latency track complaints?",
        formula: "CORRELATE(payment_auth_p95, checkout_failure_rate)",
        plan: { metrics: ["payment_auth_p95", "checkout_failure_rate"], segment: "mobile-web" },
        result: "The fixture shows payment latency and failures rising together after release.",
        bars: [["failure rate", 18], ["latency (s)", 4.8]],
        relevant: [0, 2],
        citations: ["APM rollup · payment_authorize", "Support warehouse · checkout_daily"]
      }
    });
    const SURFACES = Object.freeze({
      executive: [
        { type: "Status", props: { tone: "coral", text: "Incident contained to mobile checkout" } },
        { type: "Metric", props: { label: "Failure rate", value: "18%", delta: "+14 pp" } },
        { type: "Timeline", props: { items: ["Aug 25 · release deployed", "Aug 26 · complaint spike detected", "Now · rollback awaiting approval"] } }
      ],
      engineering: [
        { type: "Status", props: { tone: "violet", text: "Probable retry regression" } },
        { type: "Metric", props: { label: "Payment auth p95", value: "4.8s", delta: "+3.3s" } },
        { type: "EvidenceList", props: { items: ["Retry logic changed in 2026.08.25", "Mobile failure rate reached 18%", "Desktop baseline held at 3%"] } },
        { type: "UnsupportedChart", props: { reason: "Not in approved catalog" } },
        { type: "ActionCard", props: { title: "Recommended next step", text: "Preview rollback impact, then request approval." } }
      ],
      support: [
        { type: "Status", props: { tone: "mint", text: "Customer response ready for review" } },
        { type: "EvidenceList", props: { items: ["Affects mobile checkout only", "No evidence of duplicate charges", "Existing sessions may need to retry"] } },
        { type: "ActionCard", props: { title: "Suggested reply", text: "We identified a mobile checkout issue and are restoring the previous release." } }
      ]
    });
    const ACTIONS = Object.freeze([
      { id: "inspect", risk: "read-only", title: "Inspect release telemetry", detail: "Read deployment and payment traces. No state changes." },
      { id: "banner", risk: "reversible", title: "Draft customer banner", detail: "Prepare a reviewable banner; publishing remains separate." },
      { id: "rollback", risk: "consequential", title: "Roll back mobile release", detail: "Restore the prior mobile-web release after explicit approval." }
    ]);
    const STATIONS = Object.freeze([
      { id: "sense", name: "Sense", description: "Arrange evidence in space" },
      { id: "ask", name: "Ask", description: "Query governed meaning" },
      { id: "compose", name: "Compose", description: "Stream approved UI" },
      { id: "act", name: "Act", description: "Approve and undo" }
    ]);
    let eventSequence = 0;
    let state;
    let pulseTape = false;

    function createEvent(type, actor, summary, payload, reversible) {
      eventSequence += 1;
      return {
        id: "event-" + eventSequence,
        time: new Date(Date.UTC(2026, 7, 26, 9, eventSequence)).toISOString().slice(11, 19),
        type, actor, summary, payload, reversible
      };
    }

    function createInitialState() {
      return {
        station: "sense",
        evidence: EVIDENCE.map(item => ({ ...item, group: null })),
        clustered: false,
        queryId: null,
        surfaceIntent: "engineering",
        surfaceIndex: 0,
        surfacePlaying: false,
        surfaceTimer: null,
        proposedActionId: "rollback",
        rolloutPercent: 100,
        actionMode: "review",
        actionNotice: null,
        fixtureRelease: "2026.08.25",
        telemetryInspected: false,
        bannerDraft: null,
        movementMenuId: null,
        executions: [],
        events: [createEvent("state", "system", "Case opened", { caseId: "CX-204" }, false)],
        eventFilter: "all",
        expandedEventId: null,
        announcement: "Case CX-204 opened."
      };
    }

    function appendEvent(type, actor, summary, payload, reversible) {
      const payloadSnapshot = JSON.parse(JSON.stringify(payload));
      const event = createEvent(type, actor, summary, payloadSnapshot, reversible);
      state.events.push(event);
      state.announcement = summary;
      pulseTape = true;
      return event;
    }

    function stopSurfaceTimer() {
      if (state.surfaceTimer !== null) {
        window.clearTimeout(state.surfaceTimer);
        state.surfaceTimer = null;
      }
      state.surfacePlaying = false;
    }

    function setStation(id) {
      if (!STATIONS.some(item => item.id === id)) return;
      stopSurfaceTimer();
      state.station = id;
      appendEvent("state", "human", "Opened " + id + " instrument", { station: id }, false);
      render();
      document.querySelector(".instrument h2")?.focus();
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function button(label, handler, className) {
      const node = element("button", className, label);
      node.type = "button";
      node.addEventListener("click", handler);
      return node;
    }

    function instrumentHead(title, description) {
      const head = element("div", "instrument-head");
      const copy = element("div");
      const eyebrow = element("p", "eyebrow", STATIONS.find(item => item.id === state.station).name + " instrument");
      const heading = element("h2", "", title);
      heading.tabIndex = -1;
      copy.append(eyebrow, heading, element("p", "", description));
      head.append(copy, element("span", "simulation-note", "Simulated fixture output"));
      return head;
    }

    function renderRail() {
      const rail = document.querySelector(".case-rail");
      rail.replaceChildren();
      const list = element("ol", "rail-list");
      STATIONS.forEach((station, index) => {
        const item = element("li");
        const tab = button("", () => setStation(station.id), "station-tab");
        tab.setAttribute("aria-current", state.station === station.id ? "step" : "false");
        tab.append(
          element("span", "station-number", "0" + (index + 1)),
          document.createTextNode(station.name),
          element("span", "station-number", station.description)
        );
        item.append(tab);
        list.append(item);
      });
      const track = element("div", "progress-track");
      track.setAttribute("aria-label", "Lab progress");
      const fill = element("div", "progress-fill");
      const current = STATIONS.findIndex(item => item.id === state.station) + 1;
      fill.style.width = (current / STATIONS.length * 100) + "%";
      track.append(fill);
      rail.append(list, track);
    }

    function resetSense() {
      state.evidence = EVIDENCE.map(item => ({ ...item, group: null }));
      state.clustered = false;
      state.movementMenuId = null;
      appendEvent("state", "human", "Evidence canvas reset", { station: "sense" }, false);
      render();
    }

    function clusterEvidence() {
      const targets = {
        "quote-1": [20, 22, "checkout"], "metric-1": [42, 22, "checkout"], "release-1": [31, 45, "checkout"],
        "trace-1": [72, 24, "latency"], "quote-2": [72, 48, "latency"], "distractor": [75, 80, "unrelated"]
      };
      state.evidence = state.evidence.map(item => {
        const target = targets[item.id];
        return { ...item, x: target[0], y: target[1], group: target[2] };
      });
      state.clustered = true;
      state.movementMenuId = null;
      appendEvent("state", "agent", "Signals clustered by semantic and spatial cues", {
        groups: ["mobile checkout", "payment latency"],
        unrelated: ["desktop search icons"]
      }, false);
      render();
    }

    function clampEvidencePosition(x, y) {
      return {
        x: Math.max(8, Math.min(92, x)),
        y: Math.max(10, Math.min(90, y))
      };
    }

    function setEvidencePosition(id, x, y) {
      const current = state.evidence.find(item => item.id === id);
      if (!current) return false;
      const next = clampEvidencePosition(x, y);
      const moved = next.x !== current.x || next.y !== current.y;
      if (!moved) return false;
      state.evidence = state.evidence.map(item => item.id === id
        ? { ...item, x: next.x, y: next.y, group: null }
        : { ...item, group: null });
      state.clustered = false;
      return true;
    }

    function moveEvidence(id, dx, dy, direction) {
      const current = state.evidence.find(item => item.id === id);
      if (!current || !setEvidencePosition(id, current.x + dx, current.y + dy)) return;
      state.movementMenuId = id;
      appendEvent("state", "human", "Moved evidence card", { evidenceId: id, delta: [dx, dy] }, false);
      render();
      document.querySelector('[data-evidence-id="' + id + '"][data-move-direction="' + direction + '"]')?.focus();
    }

    function enableDrag(card, evidence) {
      card.addEventListener("pointerdown", event => {
        if (event.target.closest("details")) return;
        card.setPointerCapture(event.pointerId);
        const canvas = card.parentElement;
        let moved = false;
        card.classList.add("dragging");
        const move = moveEvent => {
          const rect = canvas.getBoundingClientRect();
          const nextX = (moveEvent.clientX - rect.left) / rect.width * 100;
          const nextY = (moveEvent.clientY - rect.top) / rect.height * 100;
          if (setEvidencePosition(evidence.id, nextX, nextY)) {
            moved = true;
            const current = state.evidence.find(item => item.id === evidence.id);
            card.style.left = current.x + "%";
            card.style.top = current.y + "%";
            card.dataset.group = "raw";
          }
        };
        const finish = finishEvent => {
          if (card.hasPointerCapture(finishEvent.pointerId)) card.releasePointerCapture(finishEvent.pointerId);
          card.removeEventListener("pointermove", move);
          card.removeEventListener("pointerup", finish);
          card.removeEventListener("pointercancel", finish);
          card.classList.remove("dragging");
          if (moved) {
            const current = state.evidence.find(item => item.id === evidence.id);
            appendEvent("state", "human", "Dragged evidence card", {
              evidenceId: evidence.id,
              position: [Math.round(current.x), Math.round(current.y)]
            }, false);
            render();
          }
        };
        card.addEventListener("pointermove", move);
        card.addEventListener("pointerup", finish);
        card.addEventListener("pointercancel", finish);
      });
    }

    function renderSense(container) {
      container.append(instrumentHead("Spatial evidence canvas", "Move the raw signals, then let the deterministic clustering routine reveal two related groups and one distractor."));
      const controls = element("div", "controls");
      controls.append(button("Cluster signals", clusterEvidence, "primary"), button("Reset canvas", resetSense));
      const canvas = element("div", "canvas");
      canvas.setAttribute("aria-label", "Evidence canvas with six movable cards");
      state.evidence.forEach(evidence => {
        const card = element("article", "evidence-card");
        card.style.left = evidence.x + "%";
        card.style.top = evidence.y + "%";
        card.dataset.group = evidence.group || "raw";
        card.append(element("span", "card-kind", evidence.kind), element("p", "card-copy", evidence.text));
        const menu = element("details", "card-menu");
        menu.open = state.movementMenuId === evidence.id;
        const summary = element("summary", "", "Move");
        summary.setAttribute("aria-label", "Move " + evidence.kind + " card");
        const grid = element("div", "move-grid");
        [["↑", 0, -5, "up"], ["←", -5, 0, "left"], ["→", 5, 0, "right"], ["↓", 0, 5, "down"]].forEach(move => {
          const control = button(move[0], () => moveEvidence(evidence.id, move[1], move[2], move[3]));
          control.setAttribute("aria-label", "Move card " + move[3]);
          control.dataset.evidenceId = evidence.id;
          control.dataset.moveDirection = move[3];
          grid.append(control);
        });
        menu.append(summary, grid);
        card.append(menu);
        enableDrag(card, evidence);
        canvas.append(card);
      });
      container.append(controls, canvas);
      if (state.clustered) {
        container.append(element("div", "panel cue-note",
          "Cue report: complaint wording and the retry release align with mobile checkout; elevated authorization p95 forms the payment-latency group. The desktop search icon note is unrelated."));
      }
    }

    function selectQuery(queryId) {
      const query = QUERIES[queryId];
      state.queryId = queryId;
      appendEvent("tool", "agent", "Analyzed " + query.label, query.plan, false);
      render();
    }

    function clearQuery() {
      state.queryId = null;
      appendEvent("state", "human", "Analysis cleared", { station: "ask" }, false);
      render();
    }

    function renderAsk(container) {
      container.append(instrumentHead("Semantic data sheet", "Ask governed questions over named metrics. Every answer exposes its formula, plan, confidence, and sources."));
      const chips = element("div", "query-chips");
      Object.entries(QUERIES).forEach(([id, query]) => {
        const chip = button(query.label, () => selectQuery(id), state.queryId === id ? "selected" : "");
        chip.setAttribute("aria-pressed", String(state.queryId === id));
        chips.append(chip);
      });
      chips.append(button("Clear analysis", clearQuery));
      const layout = element("div", "ask-layout");
      const data = element("div");
      const tableWrap = element("div", "table-wrap");
      const table = element("table", "data-table");
      const caption = element("caption", "sr-only", "Checkout metrics by release and platform");
      const thead = element("thead");
      const header = element("tr");
      ["Release", "Platform", "Sessions", "Failures", "Rate", "Auth p95"].forEach(value => header.append(element("th", "", value)));
      thead.append(header);
      const tbody = element("tbody");
      ROWS.forEach((row, index) => {
        const tr = element("tr", state.queryId && QUERIES[state.queryId].relevant.includes(index) ? "relevant" : "");
        [row.release, row.platform, row.sessions.toLocaleString("en-US"), row.failures.toLocaleString("en-US"), row.rate + "%", row.latency + "s"]
          .forEach(value => tr.append(element("td", "", value)));
        tbody.append(tr);
      });
      table.append(caption, thead, tbody);
      tableWrap.append(table);
      data.append(tableWrap);
      const dictionaryPanel = element("div", "panel");
      dictionaryPanel.append(element("h3", "", "Metric dictionary"));
      const dictionary = element("dl", "dictionary");
      [["checkout_failure_rate", "Failed checkout sessions ÷ all checkout sessions"], ["payment_auth_p95", "95th percentile authorization duration"], ["release", "Governed mobile-web deployment identifier"]].forEach(entry => {
        const wrapper = element("div");
        wrapper.append(element("dt", "", entry[0]), element("dd", "", entry[1]));
        dictionary.append(wrapper);
      });
      dictionaryPanel.append(dictionary);
      layout.append(data, dictionaryPanel);
      container.append(chips, layout);
      if (state.queryId) {
        const query = QUERIES[state.queryId];
        const result = element("section", "panel analysis-result");
        result.append(element("p", "label", "Inspectable result"), element("h3", "", query.result), element("p", "formula", query.formula));
        const plan = element("p", "", "Query plan · " + JSON.stringify(query.plan));
        const bars = element("div", "bars");
        query.bars.forEach(item => {
          const row = element("div", "bar-row");
          const track = element("div", "bar-track");
          const fill = element("div", "bar-fill");
          fill.style.width = Math.min(100, item[1] / 20 * 100) + "%";
          track.append(fill);
          row.append(element("span", "", item[0]), track, element("strong", "", String(item[1])));
          bars.append(row);
        });
        result.append(plan, bars, element("p", "confidence", "Confidence · high for this fixed fixture"));
        const citations = element("p", "", "Sources · " + query.citations.join(" · "));
        result.append(citations);
        container.append(result);
      }
    }

    function renderMetric(props) {
      const node = element("article", "surface-node surface-metric");
      node.append(element("span", "label", props.label), element("strong", "", props.value), element("span", "", props.delta));
      return node;
    }
    function renderTimeline(props) {
      const node = element("article", "surface-node");
      node.append(element("h3", "", "Timeline"));
      const list = element("ol", "timeline-list");
      props.items.forEach(item => list.append(element("li", "", item)));
      node.append(list);
      return node;
    }
    function renderEvidenceList(props) {
      const node = element("article", "surface-node");
      node.append(element("h3", "", "Evidence"));
      const list = element("ul", "evidence-list");
      props.items.forEach(item => list.append(element("li", "", item)));
      node.append(list);
      return node;
    }
    function renderStatus(props) {
      const node = element("article", "surface-node");
      node.style.borderLeft = "6px solid var(--" + props.tone + ")";
      node.append(element("span", "label", "Status"), element("p", "", props.text));
      return node;
    }
    function renderActionCard(props) {
      const node = element("article", "surface-node");
      node.append(element("h3", "", props.title), element("p", "", props.text));
      return node;
    }
    const SURFACE_RENDERERS = Object.freeze({
      Metric: renderMetric,
      Timeline: renderTimeline,
      EvidenceList: renderEvidenceList,
      Status: renderStatus,
      ActionCard: renderActionCard
    });

    function renderSurfaceNode(node) {
      const renderer = SURFACE_RENDERERS[node.type];
      if (!renderer) {
        const blocked = element("article", "surface-node blocked");
        blocked.append(element("strong", "", "Blocked by client catalog"), element("p", "", node.type + " is not an approved component and was not rendered."));
        return blocked;
      }
      return renderer(node.props);
    }

    function surfaceStep() {
      const messages = SURFACES[state.surfaceIntent];
      if (state.surfaceIndex >= messages.length) {
        stopSurfaceTimer();
        state.announcement = "Surface generation complete.";
        render();
        return;
      }
      const node = messages[state.surfaceIndex];
      state.surfaceIndex += 1;
      appendEvent("surface", "agent", "Rendered illustrative " + node.type + " node", { type: node.type, index: state.surfaceIndex }, false);
      render();
      if (state.surfacePlaying) scheduleSurfaceStep();
    }

    function scheduleSurfaceStep() {
      if (!state.surfacePlaying) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        while (state.surfaceIndex < SURFACES[state.surfaceIntent].length) {
          const node = SURFACES[state.surfaceIntent][state.surfaceIndex];
          state.surfaceIndex += 1;
          appendEvent("surface", "agent", "Rendered illustrative " + node.type + " node", { type: node.type, index: state.surfaceIndex }, false);
        }
        stopSurfaceTimer();
        render();
        return;
      }
      state.surfaceTimer = window.setTimeout(() => {
        state.surfaceTimer = null;
        surfaceStep();
      }, 650);
    }

    function generateSurface() {
      stopSurfaceTimer();
      state.surfaceIndex = 0;
      state.surfacePlaying = true;
      appendEvent("surface", "human", "Started simulated surface stream", { intent: state.surfaceIntent }, false);
      render();
      scheduleSurfaceStep();
    }

    function toggleSurface() {
      if (state.surfacePlaying) {
        stopSurfaceTimer();
        appendEvent("surface", "human", "Paused simulated surface stream", { index: state.surfaceIndex }, false);
        render();
      } else if (state.surfaceIndex < SURFACES[state.surfaceIntent].length) {
        state.surfacePlaying = true;
        appendEvent("surface", "human", "Resumed simulated surface stream", { index: state.surfaceIndex }, false);
        render();
        scheduleSurfaceStep();
      }
    }

    function resetSurface() {
      stopSurfaceTimer();
      state.surfaceIndex = 0;
      appendEvent("state", "human", "Surface composer reset", { station: "compose" }, false);
      render();
    }

    function renderCompose(container) {
      container.append(instrumentHead("Declarative surface stream", "Choose an intent and inspect illustrative A2UI-like messages as a fixed local catalog renders native elements."));
      const intents = element("div", "intent-picker");
      ["executive", "engineering", "support"].forEach(intent => {
        const control = button(intent[0].toUpperCase() + intent.slice(1), () => {
          stopSurfaceTimer();
          state.surfaceIntent = intent;
          state.surfaceIndex = 0;
          appendEvent("state", "human", "Changed surface intent", { intent }, false);
          render();
        }, state.surfaceIntent === intent ? "selected" : "");
        control.setAttribute("aria-pressed", String(state.surfaceIntent === intent));
        intents.append(control);
      });
      const controls = element("div", "controls");
      controls.append(
        button("Generate surface", generateSurface, "primary"),
        button(state.surfacePlaying ? "Pause" : "Resume", toggleSurface),
        button("Step", () => { stopSurfaceTimer(); surfaceStep(); }),
        button("Reset", resetSurface)
      );
      const layout = element("div", "compose-layout");
      const surface = element("div", "surface panel");
      surface.setAttribute("aria-label", "Rendered declarative surface");
      SURFACES[state.surfaceIntent].slice(0, state.surfaceIndex).forEach(node => surface.append(renderSurfaceNode(node)));
      if (state.surfaceIndex === 0) surface.append(element("p", "", "The approved surface will assemble here."));
      const log = element("div", "stream-log");
      log.setAttribute("aria-label", "Illustrative protocol messages");
      SURFACES[state.surfaceIntent].slice(0, state.surfaceIndex).forEach((node, index) => {
        log.append(element("p", "protocol-line", "illustrative event " + (index + 1) + " · { type: \"" + node.type + "\" }"));
      });
      layout.append(surface, log);
      container.append(intents, controls, layout);
    }

    function executeAction(actionId, decision, modifications) {
      const action = ACTIONS.find(item => item.id === actionId);
      if (!action) return;
      const activeExecution = state.executions.find(item => item.actionId === actionId && !item.undone);
      if (activeExecution) {
        state.actionNotice = action.title + " is already active. Undo it before making another decision.";
        state.announcement = state.actionNotice;
        render();
        return;
      }
      if (decision === "reject") {
        appendEvent("interrupt", "human", "Rejected " + action.title, { actionId, decision }, false);
        state.actionMode = "rejected";
        state.actionNotice = action.title + " rejected. No side effect was applied.";
        render();
        return;
      }
      if (action.risk === "consequential" && decision !== "approve") {
        state.actionMode = "edit";
        state.actionNotice = "Editing rollout scope. Approval is still required.";
        appendEvent("interrupt", "human", "Requested rollback modification", { actionId, decision: "edit" }, false);
        render();
        return;
      }
      const rollout = modifications?.rolloutPercent || 100;
      let before;
      let after;
      if (actionId === "inspect") {
        before = { telemetryInspected: state.telemetryInspected };
        after = { telemetryInspected: true };
      } else if (actionId === "banner") {
        before = { bannerDraft: state.bannerDraft };
        after = { bannerDraft: "Mobile checkout issue identified · draft only" };
      } else {
        before = { release: state.fixtureRelease, rolloutPercent: 0 };
        after = { release: "2026.08.18", rolloutPercent: rollout };
      }
      const execution = {
        id: "execution-" + (state.executions.length + 1),
        actionId,
        before,
        after,
        undone: false
      };
      state.executions.push(execution);
      if (actionId === "inspect") state.telemetryInspected = true;
      if (actionId === "banner") state.bannerDraft = after.bannerDraft;
      if (actionId === "rollback") state.fixtureRelease = after.release;
      state.actionMode = "executed";
      state.actionNotice = action.title + " executed. An undo control is available below.";
      appendEvent("tool", "agent", "Executed approved " + action.title, execution, true);
      render();
    }

    function undoAction(executionId) {
      const execution = state.executions.find(item => item.id === executionId);
      if (!execution || execution.undone) return;
      execution.undone = true;
      if (execution.actionId === "inspect") state.telemetryInspected = execution.before.telemetryInspected;
      if (execution.actionId === "banner") state.bannerDraft = execution.before.bannerDraft;
      if (execution.actionId === "rollback") state.fixtureRelease = execution.before.release;
      state.actionMode = "review";
      state.actionNotice = execution.actionId + " action undone. Prior fixture state restored.";
      appendEvent("tool", "human", "Undid " + execution.actionId + " action", { executionId, restored: execution.before }, true);
      render();
    }

    function resetAct() {
      state.executions = [];
      state.fixtureRelease = "2026.08.25";
      state.telemetryInspected = false;
      state.bannerDraft = null;
      state.rolloutPercent = 100;
      state.actionMode = "review";
      state.actionNotice = null;
      appendEvent("state", "human", "Action station reset", { station: "act" }, false);
      render();
    }

    function renderExecutionRecords(step, actionId) {
      state.executions.filter(item => item.actionId === actionId).forEach(execution => {
        const record = element("div", "execution");
        record.append(element("strong", "", execution.undone ? "Action undone" : "Executed · audit record " + execution.id));
        if (!execution.undone) {
          const undo = button("Undo this action", () => undoAction(execution.id));
          undo.setAttribute("aria-label", "Undo " + actionId + " action");
          record.append(undo);
        }
        step.append(record);
      });
    }

    function renderAct(container) {
      container.append(instrumentHead("Agent plan and control point", "Risk labels set the interaction contract: inspect automatically, preview reversible work, and interrupt before consequential action."));
      const controls = element("div", "controls");
      controls.append(button("Reset actions", resetAct));
      container.append(controls);
      if (state.actionNotice) {
        const notice = element("div", "panel action-notice", state.actionNotice);
        notice.setAttribute("role", "status");
        container.append(notice);
      }
      const plan = element("div", "action-plan");
      ACTIONS.forEach(action => {
        const step = element("article", "action-step");
        const activeExecution = state.executions.find(item => item.actionId === action.id && !item.undone);
        step.append(element("span", "risk risk-" + action.risk, action.risk), element("h3", "", action.title), element("p", "", action.detail));
        if (action.id === "inspect") {
          const inspect = button("Run inspection", () => executeAction("inspect", "approve"));
          inspect.disabled = Boolean(activeExecution);
          step.append(inspect);
        } else if (action.id === "banner") {
          const preview = button("Create preview", () => executeAction("banner", "approve"));
          preview.disabled = Boolean(activeExecution);
          step.append(preview);
        } else {
          const diff = element("div", "diff");
          diff.append(
            element("span", "", "Before: mobile-web 2026.08.25, 18% checkout failure"),
            element("span", "", "After:  mobile-web 2026.08.18, expected 4% checkout failure"),
            element("span", "", "Impact: ~3,400 active sessions restart checkout")
          );
          step.append(diff);
          if (state.actionMode === "edit" && !activeExecution) {
            const edit = element("div", "edit-rollout");
            const label = element("label", "", "Rollout percentage");
            label.htmlFor = "rollout";
            const input = element("input");
            input.id = "rollout";
            input.type = "number";
            input.min = "10";
            input.max = "100";
            input.step = "10";
            input.value = String(state.rolloutPercent);
            input.addEventListener("change", () => {
              state.rolloutPercent = Math.max(10, Math.min(100, Number(input.value) || 100));
            });
            edit.append(label, input, element("span", "", "%"));
            step.append(edit);
          }
          if (!activeExecution) {
            const decisions = element("div", "decision-row");
            decisions.append(
              button(state.actionMode === "edit" ? "Approve modified rollout" : "Approve rollback", () => executeAction("rollback", "approve", { rolloutPercent: state.rolloutPercent }), "primary"),
              button("Edit rollout", () => executeAction("rollback", "edit")),
              button("Reject", () => executeAction("rollback", "reject"), "danger")
            );
            step.append(decisions);
          }
        }
        renderExecutionRecords(step, action.id);
        plan.append(step);
      });
      container.append(plan);
    }

    function renderCaseFile() {
      const file = document.querySelector(".case-file");
      file.replaceChildren(element("p", "eyebrow", "Shared case state"), element("h2", "", "CX-204"));
      const dl = element("dl");
      [
        ["Incident", "Checkout complaint spike"],
        ["Active release", state.fixtureRelease],
        ["Evidence", state.clustered ? "2 clusters + 1 unrelated" : "6 raw signals"],
        ["Analysis", state.queryId ? QUERIES[state.queryId].label : "Not selected"],
        ["Surface", state.surfaceIndex + " nodes rendered"],
        ["Audit events", String(state.events.length)]
      ].forEach(entry => {
        const wrapper = element("div");
        wrapper.append(element("dt", "", entry[0]), element("dd", "", entry[1]));
        dl.append(wrapper);
      });
      file.append(dl);
    }

    function renderEventTape() {
      const tape = document.querySelector(".event-tape");
      tape.replaceChildren();
      const head = element("div", "tape-head");
      const copy = element("div");
      const title = element("h2", "", "Shared event tape");
      title.id = "event-title";
      copy.append(title, element("p", "", "The application contract between human, agent, and frontend."));
      const filters = element("div", "filter-list");
      filters.setAttribute("aria-label", "Filter event tape");
      ["all", "state", "tool", "surface", "interrupt"].forEach(filter => {
        const control = button(filter, () => {
          state.eventFilter = filter;
          state.announcement = "Showing " + filter + " events.";
          render();
        }, state.eventFilter === filter ? "selected" : "");
        control.setAttribute("aria-pressed", String(state.eventFilter === filter));
        filters.append(control);
      });
      head.append(copy, filters);
      const scope = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      scope.setAttribute("class", "scope" + (pulseTape ? " pulse" : ""));
      scope.setAttribute("viewBox", "0 0 1000 35");
      scope.setAttribute("preserveAspectRatio", "none");
      scope.setAttribute("aria-hidden", "true");
      const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      const visibleCount = Math.min(state.events.length, 10);
      const points = ["0,25"];
      for (let index = 1; index <= visibleCount; index += 1) {
        const x = index * (1000 / Math.max(visibleCount, 1));
        points.push((x - 18) + ",25", x + "," + (index % 2 ? 7 : 17), (x + 18) + ",25");
      }
      line.setAttribute("points", points.join(" "));
      scope.append(line);
      const list = element("div", "events");
      state.events.filter(event => state.eventFilter === "all" || event.type === state.eventFilter).slice().reverse().forEach(event => {
        const row = element("article", "event-row");
        const expanded = state.expandedEventId === event.id;
        const trigger = button("");
        trigger.setAttribute("aria-expanded", String(expanded));
        trigger.setAttribute("aria-controls", "payload-" + event.id);
        trigger.append(
          element("span", "event-meta", event.time + " · " + event.actor + " · " + event.type),
          element("span", "event-summary" + (event.reversible ? " reversible" : ""), event.summary)
        );
        trigger.addEventListener("click", () => {
          state.expandedEventId = expanded ? null : event.id;
          render();
        });
        row.append(trigger);
        if (expanded) {
          const payload = element("pre", "event-payload");
          payload.id = "payload-" + event.id;
          payload.textContent = JSON.stringify(event.payload, null, 2);
          row.append(payload);
        }
        list.append(row);
      });
      tape.append(head, scope, list);
      pulseTape = false;
    }

    function render() {
      renderRail();
      const instrument = document.querySelector(".instrument");
      instrument.replaceChildren();
      if (state.station === "sense") renderSense(instrument);
      if (state.station === "ask") renderAsk(instrument);
      if (state.station === "compose") renderCompose(instrument);
      if (state.station === "act") renderAct(instrument);
      renderCaseFile();
      renderEventTape();
      document.getElementById("announcer").textContent = state.announcement;
    }

    state = createInitialState();
    render();
  </script>
</body>
</html>
