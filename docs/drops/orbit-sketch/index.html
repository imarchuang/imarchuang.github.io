<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/og-default.svg" type="image/svg+xml" />
    <title>orbit sketch</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #07080c; }
      canvas { display: block; width: 100%; height: 100%; }
      p {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        margin: 0;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
        color: #9aa3b5;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <p>orbit sketch · move the pointer</p>
    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const dots = Array.from({ length: 48 }, (_, i) => ({
        a: (i / 48) * Math.PI * 2,
        r: 40 + (i % 12) * 18,
        s: 0.004 + (i % 7) * 0.0015,
      }));
      const mouse = { x: 0, y: 0 };
      let w = 0;
      let h = 0;

      function resize() {
        w = canvas.width = window.innerWidth * devicePixelRatio;
        h = canvas.height = window.innerHeight * devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        mouse.x = window.innerWidth / 2;
        mouse.y = window.innerHeight / 2;
      }
      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      resize();

      function frame(t) {
        ctx.fillStyle = "rgba(7, 8, 12, 0.18)";
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        const cx = mouse.x;
        const cy = mouse.y;
        for (const d of dots) {
          const x = cx + Math.cos(d.a + t * d.s) * d.r;
          const y = cy + Math.sin(d.a + t * d.s) * d.r;
          ctx.beginPath();
          ctx.arc(x, y, 2.2, 0, Math.PI * 2);
          ctx.fillStyle = `hsl(${260 + (d.r % 80)}, 70%, 72%)`;
          ctx.fill();
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
